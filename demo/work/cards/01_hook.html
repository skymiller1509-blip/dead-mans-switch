<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0d0b1e; color:#fff; font-family:system-ui, sans-serif; overflow:hidden; }
  .wrap { width:1920px; height:1080px; display:flex; flex-direction:column; justify-content:center; padding:0 140px; }
  .kicker { color:#8b7cff; font-size:34px; font-weight:700; letter-spacing:4px; text-transform:uppercase; margin-bottom:28px; }
  h1 { font-size:92px; line-height:1.15; font-weight:800; }
  .accent { color:#8b7cff; }
  p.sub { font-size:40px; color:#c9c6e0; margin-top:30px; line-height:1.4; }
</style></head><body>
<div class="wrap">
  <div class="kicker">Dead Man's Switch</div>
  <h1>What happens to your crypto<br>if <span class="accent">you disappear?</span></h1>
  <p class="sub">Nobody else can move it. Only your wallet can sign.</p>
</div>
</body></html>
