<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1920px; height:1080px; background:#0d0b1e; color:#fff; font-family:system-ui, sans-serif; overflow:hidden; }
  .wrap { width:1920px; height:1080px; display:flex; flex-direction:column; justify-content:center; padding:0 140px; }
  .kicker { color:#8b7cff; font-size:34px; font-weight:700; letter-spacing:4px; text-transform:uppercase; margin-bottom:40px; }
  .step { display:flex; align-items:center; margin:26px 0; }
  .num { width:96px; height:96px; border-radius:50%; background:#8b7cff; color:#0d0b1e; font-size:48px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:36px; }
  .step h2 { font-size:56px; font-weight:700; }
  .step p { font-size:32px; color:#c9c6e0; margin-top:4px; }
  .result { margin-top:44px; font-size:44px; font-weight:700; color:#8b7cff; }
</style></head><body>
<div class="wrap">
  <div class="kicker">The fix, in one line</div>
  <div class="step"><div class="num">1</div><div><h2>Lock your funds in a vault</h2><p>Your money sits safe on Base Sepolia.</p></div></div>
  <div class="step"><div class="num">2</div><div><h2>Name an heir</h2><p>The person who should get it if you are gone.</p></div></div>
  <div class="step"><div class="num">3</div><div><h2>Ping to say you are alive</h2><p>One button press resets the clock.</p></div></div>
  <div class="result">Silence for the days you chose, and the money moves on its own.</div>
</div>
</body></html>
